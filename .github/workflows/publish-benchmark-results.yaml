name: Publish benchmark results

on:
  push:
    paths:
      - .github/workflows/publish-benchmark-results.yaml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download successful 60-trial benchmark
        uses: actions/download-artifact@v4
        with:
          name: synthetic-benchmark-combined
          path: results/synthetic-ci-60-trials-kind-v1.31.4-tekton-v1.6.0
          run-id: 37165598217
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit immutable raw results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/synthetic-ci-60-trials-kind-v1.31.4-tekton-v1.6.0
          git commit -m "Publish 60-trial synthetic benchmark results"
          git push origin main
