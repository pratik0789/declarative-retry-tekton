apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: retry-stateful-pvc
  namespace: retry-stateful
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 64Mi
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: retry-stateful
  namespace: retry-stateful
spec:
  workspaces:
    - name: shared
  tasks:
    - name: clone
      workspaces: [{name: src, workspace: shared}]
      taskSpec:
        workspaces: [{name: src}]
        results: [{name: commit}, {name: digest}]
        steps:
          - name: run
            image: alpine:3.20
            script: |
              set -eu
              head -c 64 /dev/urandom | od -An -tx1 | tr -d ' \n' > "$(workspaces.src.path)/source.txt"
              head -c 6 /dev/urandom | od -An -tx1 | tr -d ' \n' > "$(results.commit.path)"
              sha256sum "$(workspaces.src.path)/source.txt" | cut -d' ' -f1 | tr -d '\n' > "$(results.digest.path)"
    - name: build
      runAfter: [clone]
      params:
        - {name: commit, value: $(tasks.clone.results.commit)}
        - {name: digest, value: $(tasks.clone.results.digest)}
      workspaces: [{name: src, workspace: shared}]
      taskSpec:
        params: [{name: commit}, {name: digest}]
        workspaces: [{name: src}]
        results: [{name: image}]
        steps:
          - name: run
            image: alpine:3.20
            script: |
              set -eu
              source_file="$(workspaces.src.path)/source.txt"
              if [ ! -f "$source_file" ]; then
                echo "STATE-MISSING: source.txt written by clone is not present"
                exit 1
              fi
              actual=`sha256sum "$source_file" | cut -d' ' -f1`
              if [ "$actual" != "$(params.digest)" ]; then
                echo "STATE-MISMATCH: expected $(params.digest), found $actual"
                exit 1
              fi
              echo "STATE-VERIFIED: commit $(params.commit) digest $actual"
              printf 'img-%s' "$(params.commit)" > "$(results.image.path)"
    - name: scan
      runAfter: [build]
      params:
        - {name: image, value: $(tasks.build.results.image)}
      taskSpec:
        params: [{name: image}]
        steps:
          - name: run
            image: alpine:3.20
            script: |
              case "$(context.pipelineRun.name)" in
                *-source) echo "injected scan failure"; exit 1 ;;
              esac
              echo "scanned $(params.image)"
    - name: deploy
      runAfter: [scan]
      params:
        - {name: image, value: $(tasks.build.results.image)}
      taskSpec:
        params: [{name: image}]
        steps:
          - name: run
            image: alpine:3.20
            script: |
              echo "deployed $(params.image)"
---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: retry-stateful-pvc-source
  namespace: retry-stateful
spec:
  pipelineRef: {name: retry-stateful}
  workspaces:
    - name: shared
      persistentVolumeClaim: {claimName: retry-stateful-pvc}
---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: retry-stateful-vct-source
  namespace: retry-stateful
spec:
  pipelineRef: {name: retry-stateful}
  workspaces:
    - name: shared
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 64Mi
