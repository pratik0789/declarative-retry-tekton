apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: retry-fanin
  namespace: retry-ordering
spec:
  tasks:
    - name: clone
      taskSpec: {steps: [{name: run, image: alpine:3.20, script: "sleep 1"}]}
    - name: build-a
      runAfter: [clone]
      taskSpec: {steps: [{name: run, image: alpine:3.20, script: "sleep 4"}]}
    - name: build-b
      runAfter: [clone]
      taskSpec: {steps: [{name: run, image: alpine:3.20, script: "sleep 1"}]}
    - name: package
      runAfter: [build-a, build-b]
      taskSpec: {steps: [{name: run, image: alpine:3.20, script: "sleep 1"}]}
    - name: publish
      runAfter: [package]
      taskSpec: {steps: [{name: run, image: alpine:3.20, script: "sleep 1"}]}
    - name: deploy
      runAfter: [publish]
      taskSpec:
        steps:
          - name: run
            image: alpine:3.20
            script: |
              case "$(context.pipelineRun.name)" in
                *-source) echo "injected deploy failure"; exit 1 ;;
              esac
              echo deployed
---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: retry-fanin-source
  namespace: retry-ordering
spec:
  pipelineRef: {name: retry-fanin}
