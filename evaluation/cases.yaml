cases:
  - name: safe-partial-recovery
    pipeline: ../testdata/simple/pipeline.yaml
    run: ../testdata/simple/run.yaml
    policy: ../testdata/simple/policy.yaml
    taskRuns: ../testdata/simple/taskruns.yaml
    expectedDecision: recover
    expectedActions:
      clone: inherit
      build: rerun
      scan: rerun
      deploy: continue
  - name: producer-consumer-conflict
    pipeline: ../testdata/result-conflict/pipeline.yaml
    run: ../testdata/result-conflict/run.yaml
    policy: ../testdata/result-conflict/policy.yaml
    expectedDecision: recover
    expectedWarningContains: shared-result-across-closure
    expectedActions:
      build: rerun
      consume: inherit
      fail: rerun
  - name: mutable-workspace-conflict
    pipeline: ../testdata/workspace-conflict/pipeline.yaml
    run: ../testdata/workspace-conflict/run.yaml
    policy: ../testdata/workspace-conflict/policy.yaml
    expectedDecision: recover
    expectedWarningContains: shared-workspace-across-closure
    expectedActions:
      prepare: inherit
      fail: rerun
  - name: changed-pipeline
    pipeline: ../testdata/changed-pipeline/pipeline.yaml
    run: ../testdata/changed-pipeline/run.yaml
    policy: ../testdata/changed-pipeline/policy.yaml
    expectedDecision: refuse
    expectedReasonContains: changed
