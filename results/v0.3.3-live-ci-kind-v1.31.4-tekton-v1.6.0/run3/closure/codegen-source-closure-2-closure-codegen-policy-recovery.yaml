apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    retry.tekton.dev/policy: retry-codegen-closure
    retry.tekton.dev/policy-generation: "1"
    retry.tekton.dev/source-pipeline: retry-codegen
    retry.tekton.dev/source-pipeline-run: codegen-source-closure-2
    retry.tekton.dev/source-pipeline-run-uid: c719da68-6d43-4664-8546-230da1cf6f7e
  generateName: retry-codegen-retry-
  namespace: retry-closure
spec:
  params:
  - name: revision
    value: rev-codegen-2
  pipelineSpec:
    params:
    - name: revision
      type: string
    tasks:
    - name: clone
      params:
      - name: revision
        value: $(params.revision)
      taskSpec:
        metadata: {}
        params:
        - name: revision
          type: string
        results:
        - name: commit
          type: string
        spec: null
        steps:
        - computeResources: {}
          image: alpine:3.20
          name: run
          script: |
            set -eu
            cd "$(workspaces.src.path)"
            rm -rf ./app.go ./staging ./vendor
            printf 'package app\nconst Revision = "%s"\n' "$(params.revision)" > app.go
            printf '%s' "$(params.revision)" > "$(results.commit.path)"
        workspaces:
        - name: src
      workspaces:
      - name: src
        workspace: shared
    - name: build
      params:
      - name: commit
        value: $(tasks.clone.results.commit)
      runAfter:
      - clone
      taskSpec:
        metadata: {}
        params:
        - name: commit
          type: string
        results:
        - name: image
          type: string
        spec: null
        steps:
        - computeResources: {}
          image: alpine:3.20
          name: run
          script: |
            set -eu
            cd "$(workspaces.src.path)"
            printf 'const BuildTag = "release"\n' >> app.go
            blocks=`grep -c BuildTag app.go`
            digest=`sha256sum app.go | cut -c1-16`
            echo "STATE-CODEGEN: commit $(params.commit) generated-blocks $blocks digest $digest"
            printf 'img-%s' "$digest" > "$(results.image.path)"
            case "$(context.pipelineRun.name)" in
              *-source-*) echo "injected build failure after code generation"; exit 1 ;;
            esac
        workspaces:
        - name: src
      workspaces:
      - name: src
        workspace: shared
    - name: scan
      params:
      - name: image
        value: $(tasks.build.results.image)
      runAfter:
      - build
      taskSpec:
        metadata: {}
        params:
        - name: image
          type: string
        spec: null
        steps:
        - computeResources: {}
          image: alpine:3.20
          name: run
          script: |
            echo "scanned $(params.image)"
    workspaces:
    - name: shared
  taskRunTemplate:
    serviceAccountName: default
  timeouts:
    pipeline: 1h0m0s
  workspaces:
  - name: shared
    persistentVolumeClaim:
      claimName: codegen-closure-2
