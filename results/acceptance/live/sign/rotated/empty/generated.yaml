apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    retry.tekton.dev/inherited-taskruns: acquire=source-sign-acquire,publish=source-sign-publish,warmup=source-sign-warmup
    retry.tekton.dev/policy: empty
    retry.tekton.dev/source-pipeline: external-recovery
    retry.tekton.dev/source-pipeline-run: source-sign
    retry.tekton.dev/source-pipeline-run-uid: 18a52ca0-2b94-42e1-b6a0-0e09cc04c64e
  generateName: external-recovery-retry-
  namespace: retry-acceptance-20261030
spec:
  pipelineSpec:
    tasks:
    - name: sign
      taskSpec:
        metadata: {}
        spec: null
        steps:
        - computeResources: {}
          image: alpine:3.20
          name: execute
          script: |
            #!/bin/sh
            set -eu
            wget -q -O- --post-data='{}' http://oracle:8000/execute/sign
    - name: scan
      runAfter:
      - sign
      taskSpec:
        metadata: {}
        spec: null
        steps:
        - computeResources: {}
          image: alpine:3.20
          name: execute
          script: |
            #!/bin/sh
            set -eu
            wget -q -O- --post-data='{}' http://oracle:8000/execute/scan
    - name: deploy
      runAfter:
      - scan
      taskSpec:
        metadata: {}
        spec: null
        steps:
        - computeResources: {}
          image: alpine:3.20
          name: execute
          script: |
            #!/bin/sh
            set -eu
            wget -q -O- --post-data='{}' http://oracle:8000/execute/deploy
  taskRunTemplate:
    serviceAccountName: default
  timeouts:
    pipeline: 1h0m0s
