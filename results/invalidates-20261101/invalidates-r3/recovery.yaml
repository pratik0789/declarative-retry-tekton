apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    retry.tekton.dev/inherited-taskruns: observe=sb-source-observe
    retry.tekton.dev/policy: stale-build-invalidates
    retry.tekton.dev/policy-generation: "1"
    retry.tekton.dev/policy-spec: '{"pipelineRef":"stale-build","resumeWithin":"","retryOnlyLatest":false,"tasks":{"prepare":{"blocksResume":false,"invalidates":["build"],"retryWith":null}}}'
    retry.tekton.dev/policy-spec-sha256: sha256:5ca929efe65ae2e79919761cfc4d9a0b3b1ab47dec369a3bdb600f4f6c30da24
    retry.tekton.dev/source-pipeline: stale-build
    retry.tekton.dev/source-pipeline-run: sb-source
    retry.tekton.dev/source-pipeline-run-uid: 57896114-1a46-44d0-8300-0f04940f6670
  generateName: stale-build-retry-
  namespace: retry-inv2-invalidates-20261101-r3
spec:
  pipelineSpec:
    tasks:
    - name: prepare
      taskSpec:
        metadata: {}
        spec: null
        steps:
        - computeResources: {}
          image: alpine:3.20
          name: run
          script: |
            set -eu
            printf "input:$(context.taskRun.name):86437f26cc91a457" > $(workspaces.data.path)/source.txt
            rm -f $(workspaces.data.path)/receipt.txt
        workspaces:
        - name: data
      workspaces:
      - name: data
        workspace: shared
    - name: build
      runAfter:
      - prepare
      taskSpec:
        metadata: {}
        spec: null
        steps:
        - computeResources: {}
          image: alpine:3.20
          name: run
          script: |
            set -eu
            sha256sum $(workspaces.data.path)/source.txt | cut -d" " -f1 | tr -d "\n" > $(workspaces.data.path)/artifact-input.sha
            printf "built:" > $(workspaces.data.path)/artifact.txt; cat $(workspaces.data.path)/artifact-input.sha >> $(workspaces.data.path)/artifact.txt
        workspaces:
        - name: data
      workspaces:
      - name: data
        workspace: shared
    - name: gate
      runAfter:
      - build
      taskSpec:
        metadata: {}
        spec: null
        steps:
        - computeResources: {}
          image: alpine:3.20
          name: run
          script: |
            set -eu
            case "$(context.taskRun.name)" in *-source-*) echo INJECTED-GATE-FAILURE; exit 1;; esac
            echo GATE-PASSED
    - name: publish
      runAfter:
      - gate
      taskSpec:
        metadata: {}
        spec: null
        steps:
        - computeResources: {}
          image: alpine:3.20
          name: run
          script: |
            set -eu
            actual=`sha256sum $(workspaces.data.path)/source.txt | cut -d" " -f1`
            recorded=`cat $(workspaces.data.path)/artifact-input.sha`
            if [ "$actual" != "$recorded" ]; then echo STALE-ARTIFACT; exit 1; fi
            if [ "`cat $(workspaces.data.path)/artifact.txt`" != "built:$actual" ]; then echo BAD-ARTIFACT; exit 1; fi
            artifact=`sha256sum $(workspaces.data.path)/artifact.txt | cut -d" " -f1`
            printf "%s %s" "$actual" "$artifact" > $(workspaces.data.path)/receipt.txt
            echo ORACLE-CONSISTENT
        workspaces:
        - name: data
      workspaces:
      - name: data
        workspace: shared
    workspaces:
    - name: shared
  taskRunTemplate:
    serviceAccountName: default
  timeouts:
    pipeline: 1h0m0s
  workspaces:
  - name: shared
    persistentVolumeClaim:
      claimName: data
