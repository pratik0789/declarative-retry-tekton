    retry.tekton.dev/shared-state-warning-codes: shared-workspace-across-closure
    retry.tekton.dev/shared-state-warnings-accepted: "true"
    retry.tekton.dev/source-pipeline: stale-build
    retry.tekton.dev/source-pipeline-run: sb-source
    retry.tekton.dev/source-pipeline-run-uid: 23f63968-7ade-452a-8256-6ea1d788c13c
  generateName: stale-build-retry-
