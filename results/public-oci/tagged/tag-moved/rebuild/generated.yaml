apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    retry.tekton.dev/inherited-taskruns: clone=source-final-tagged-clone
    retry.tekton.dev/policy: public-oci-rebuild
    retry.tekton.dev/policy-generation: "1"
    retry.tekton.dev/policy-spec: '{"pipelineRef":"public-oci-tagged","resumeWithin":"","retryOnlyLatest":false,"tasks":{"promote":{"blocksResume":false,"retryWith":["build","retag"]}}}'
    retry.tekton.dev/policy-spec-sha256: sha256:3d5e4a691f19e4edb8fb5e53faba8cfe08ca0d744c01362a872871d26cef798e
    retry.tekton.dev/shared-state-warning-codes: shared-workspace-across-closure
    retry.tekton.dev/shared-state-warnings-accepted: "true"
    retry.tekton.dev/source-pipeline: public-oci-tagged
    retry.tekton.dev/source-pipeline-run: source-final-tagged
    retry.tekton.dev/source-pipeline-run-uid: 7358c17e-bf48-4b31-acff-3aac9c3aee45
  generateName: public-oci-tagged-retry-
  namespace: retry-public-oci-20261030
spec:
  pipelineSpec:
    tasks:
    - name: build
      params:
      - name: IMAGE
        value: registry-source:5000/application:build
      - name: DOCKERFILE
        value: examples/getting-started/Dockerfile
      - name: CONTEXT
        value: examples/getting-started
      - name: EXTRA_ARGS
        value:
        - --insecure
        - --insecure-pull
        - --cache=false
        - --reproducible
        - --force
        - --build-arg=BASE_PREFIX=registry-source:5000/base/
        - --ignore-path=/product_uuid
      - name: BUILDER_IMAGE
        value: gcr.io/kaniko-project/executor@sha256:9e69fd4330ec887829c780f5126dd80edc663df6def362cd22e79bcdf00ac53f
      taskSpec:
        description: This Task builds a simple Dockerfile with kaniko and pushes to
          a registry. This Task stores the image name and digest as results, allowing
          Tekton Chains to pick up that an image was built & sign it.
        metadata: {}
        params:
        - description: Name (reference) of the image to build.
          name: IMAGE
          type: string
        - default: ./Dockerfile
          description: Path to the Dockerfile to build.
          name: DOCKERFILE
          type: string
        - default: ./
          description: The build context used by Kaniko.
          name: CONTEXT
          type: string
        - default: []
          name: EXTRA_ARGS
          type: array
        - default: gcr.io/kaniko-project/executor:v1.5.1@sha256:c6166717f7fe0b7da44908c986137ecfeab21f31ec3992f6e128fff8a94be8a5
          description: The image on which builds will run (default is v1.5.1)
          name: BUILDER_IMAGE
          type: string
        results:
        - description: Digest of the image just built.
          name: IMAGE_DIGEST
          type: string
        - description: URL of the image just built.
          name: IMAGE_URL
          type: string
        spec: null
        steps:
        - args:
          - $(params.EXTRA_ARGS)
          - --dockerfile=$(params.DOCKERFILE)
          - --context=$(workspaces.source.path)/$(params.CONTEXT)
          - --destination=$(params.IMAGE)
          - --digest-file=$(results.IMAGE_DIGEST.path)
          command:
          - /kaniko/executor
          computeResources: {}
          image: $(params.BUILDER_IMAGE)
          name: build-and-push
          securityContext:
            runAsUser: 0
          workingDir: $(workspaces.source.path)
        - computeResources: {}
          image: docker.io/library/bash:5.1.4@sha256:c523c636b722339f41b6a431b44588ab2f762c5de5ec3bd7964420ff982fb1d9
          name: write-url
          script: |
            set -e
            image="$(params.IMAGE)"
            echo -n "${image}" | tee "$(results.IMAGE_URL.path)"
        workspaces:
        - description: Holds the context and Dockerfile
          name: source
        - description: Includes a docker `config.json`
          mountPath: /kaniko/.docker
          name: dockerconfig
          optional: true
      workspaces:
      - name: source
        workspace: source
    - name: retag
      params:
      - name: srcImageURL
        value: docker://registry-source:5000/application@$(tasks.build.results.IMAGE_DIGEST)
      - name: destImageURL
        value: docker://registry-source:5000/release:latest
      - name: srcTLSverify
        value: "false"
      - name: destTLSverify
        value: "false"
      runAfter:
      - build
      taskSpec:
        description: |-
          Skopeo is a command line tool for working with remote image registries.
          Skopeo doesn’t require a daemon to be running while performing its operations. In particular, the handy skopeo command called copy will ease the whole image copy operation. The copy command will take care of copying the image from internal.registry to production.registry. If your production registry requires credentials to login in order to push the image, skopeo can handle that as well.
        metadata: {}
        params:
        - default: ""
          description: URL of the image to be copied to the destination registry
          name: srcImageURL
          type: string
        - default: ""
          description: URL of the image where the image from source should be copied
            to
          name: destImageURL
          type: string
        - default: "true"
          description: Verify the TLS on the src registry endpoint
          name: srcTLSverify
          type: string
        - default: "true"
          description: Verify the TLS on the dest registry endpoint
          name: destTLSverify
          type: string
        - default: system
          description: How to handle multi-architecture images (system, all, or index-only)
          name: multiArch
          type: string
        spec: null
        steps:
        - computeResources: {}
          env:
          - name: HOME
            value: /tekton/home
          image: quay.io/skopeo/stable@sha256:ad1d2e25cf0234bb50476e753a8fc9debd4f0582cdd2ab6fd7bad9bacdfe3b9b
          name: skopeo-copy
          script: |
            # Function to copy multiple images.
            #
            copyimages() {
              filename="$(workspaces.images-url.path)/url.txt"
              while IFS= read -r line || [ -n "$line" ]
              do
                cmd=""
                for url in $line
                do
                  # echo $url
                  cmd="$cmd \
                      $url"
                done
                read -ra sourceDest <<<"${cmd}"
                skopeo copy --multi-arch="$(params.multiArch)" "${sourceDest[@]}" --src-tls-verify="$(params.srcTLSverify)" --dest-tls-verify="$(params.destTLSverify)"
                echo "$cmd"
              done < "$filename"
            }
            # Check that the multiArch parm is one of the supported methods
            #
            case "$(params.multiArch)" in all|system|index-only)
                ;;
              *)
                echo "Unrecognized multiArch choice: $(params.multiArch)"
                exit 1;;
            esac
            #
            # If single image is to be copied then, it can be passed through
            # params in the taskrun.
            #
            if [ "$(params.srcImageURL)" != "" ] && [ "$(params.destImageURL)" != "" ] ; then
              skopeo copy --multi-arch="$(params.multiArch)" "$(params.srcImageURL)" "$(params.destImageURL)" --src-tls-verify="$(params.srcTLSverify)" --dest-tls-verify="$(params.destTLSverify)"
            else
              # If file is provided as a configmap in the workspace then multiple images can be copied.
              #
              copyimages
            fi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
        workspaces:
        - name: images-url
      workspaces:
      - name: images-url
        workspace: copy-input
    - name: promote
      params:
      - name: srcImageURL
        value: docker://registry-source:5000/release:latest
      - name: destImageURL
        value: docker://registry-delivery:5000/delivery:latest
      - name: srcTLSverify
        value: "false"
      - name: destTLSverify
        value: "false"
      runAfter:
      - retag
      taskSpec:
        description: |-
          Skopeo is a command line tool for working with remote image registries.
          Skopeo doesn’t require a daemon to be running while performing its operations. In particular, the handy skopeo command called copy will ease the whole image copy operation. The copy command will take care of copying the image from internal.registry to production.registry. If your production registry requires credentials to login in order to push the image, skopeo can handle that as well.
        metadata: {}
        params:
        - default: ""
          description: URL of the image to be copied to the destination registry
          name: srcImageURL
          type: string
        - default: ""
          description: URL of the image where the image from source should be copied
            to
          name: destImageURL
          type: string
        - default: "true"
          description: Verify the TLS on the src registry endpoint
          name: srcTLSverify
          type: string
        - default: "true"
          description: Verify the TLS on the dest registry endpoint
          name: destTLSverify
          type: string
        - default: system
          description: How to handle multi-architecture images (system, all, or index-only)
          name: multiArch
          type: string
        spec: null
        steps:
        - computeResources: {}
          env:
          - name: HOME
            value: /tekton/home
          image: quay.io/skopeo/stable@sha256:ad1d2e25cf0234bb50476e753a8fc9debd4f0582cdd2ab6fd7bad9bacdfe3b9b
          name: skopeo-copy
          script: |
            # Function to copy multiple images.
            #
            copyimages() {
              filename="$(workspaces.images-url.path)/url.txt"
              while IFS= read -r line || [ -n "$line" ]
              do
                cmd=""
                for url in $line
                do
                  # echo $url
                  cmd="$cmd \
                      $url"
                done
                read -ra sourceDest <<<"${cmd}"
                skopeo copy --multi-arch="$(params.multiArch)" "${sourceDest[@]}" --src-tls-verify="$(params.srcTLSverify)" --dest-tls-verify="$(params.destTLSverify)"
                echo "$cmd"
              done < "$filename"
            }
            # Check that the multiArch parm is one of the supported methods
            #
            case "$(params.multiArch)" in all|system|index-only)
                ;;
              *)
                echo "Unrecognized multiArch choice: $(params.multiArch)"
                exit 1;;
            esac
            #
            # If single image is to be copied then, it can be passed through
            # params in the taskrun.
            #
            if [ "$(params.srcImageURL)" != "" ] && [ "$(params.destImageURL)" != "" ] ; then
              skopeo copy --multi-arch="$(params.multiArch)" "$(params.srcImageURL)" "$(params.destImageURL)" --src-tls-verify="$(params.srcTLSverify)" --dest-tls-verify="$(params.destTLSverify)"
            else
              # If file is provided as a configmap in the workspace then multiple images can be copied.
              #
              copyimages
            fi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
        workspaces:
        - name: images-url
      workspaces:
      - name: images-url
        workspace: copy-input
    workspaces:
    - name: source
    - name: copy-input
  taskRunTemplate:
    podTemplate:
      securityContext:
        fsGroup: 65532
    serviceAccountName: default
  timeouts:
    pipeline: 20m0s
  workspaces:
  - name: source
    persistentVolumeClaim:
      claimName: source
  - emptyDir: {}
    name: copy-input
