apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    retry.tekton.dev/inherited-taskruns: clone=retry-ordering-source-clone,migrate=retry-ordering-source-migrate
    retry.tekton.dev/policy: retry-ordering-policy
    retry.tekton.dev/policy-generation: "1"
    retry.tekton.dev/source-pipeline: retry-ordering
    retry.tekton.dev/source-pipeline-run: retry-ordering-source
    retry.tekton.dev/source-pipeline-run-uid: 217ab033-60e8-41f3-a82b-8dfb3731a351
  generateName: retry-ordering-retry-
  namespace: retry-ordering
spec:
  pipelineSpec:
    tasks:
    - name: build
      taskSpec:
        metadata: {}
        spec: null
        steps:
        - computeResources: {}
          image: alpine:3.20
          name: run
          script: sleep 3
    - name: scan
      runAfter:
      - build
      taskSpec:
        metadata: {}
        spec: null
        steps:
        - computeResources: {}
          image: alpine:3.20
          name: run
          script: sleep 3
    - name: deploy
      runAfter:
      - scan
      taskSpec:
        metadata: {}
        spec: null
        steps:
        - computeResources: {}
          image: alpine:3.20
          name: run
          script: |
            case "$(context.pipelineRun.name)" in
              *-source) echo "injected deploy failure"; exit 1 ;;
            esac
            echo deployed
  taskRunTemplate:
    serviceAccountName: default
  timeouts:
    pipeline: 1h0m0s
