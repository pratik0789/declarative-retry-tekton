apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    retry.tekton.dev/inherited-taskruns: audit=finally-upstream-source-audit
    retry.tekton.dev/policy: upstream
    retry.tekton.dev/policy-spec: '{"pipelineRef":"finally-upstream","resumeWithin":"","retryOnlyLatest":false,"tasks":{"build":{"blocksResume":false,"retryWith":["prepare"]},"notify":{"blocksResume":false,"retryWith":["build"]}}}'
    retry.tekton.dev/policy-spec-sha256: sha256:259269a1837d438b916f314c19c20c602f1b8926eb7929333617d9190029d1b1
    retry.tekton.dev/source-pipeline: finally-upstream
    retry.tekton.dev/source-pipeline-run: finally-upstream-source
    retry.tekton.dev/source-pipeline-run-uid: 5cca6ca7-1b86-4ed9-b188-8f89faa5b397
  generateName: finally-upstream-retry-
  namespace: retry-value-finally-20261030
spec:
  pipelineSpec:
    finally:
    - name: notify
      params:
      - name: image
        value: $(tasks.build.results.image)
      taskSpec:
        metadata: {}
        params:
        - name: image
          type: string
        results:
        - name: receipt
          type: string
        spec: null
        steps:
        - computeResources: {}
          image: alpine:3.20
          name: run
          script: |
            set -eu
            case "$(context.taskRun.name)" in *-source-*) echo INJECTED-NOTIFICATION-FAILURE; exit 1;; esac
            printf "%s" "$(params.image)" > "$(results.receipt.path)"
            echo NOTIFIED
    tasks:
    - name: prepare
      taskSpec:
        metadata: {}
        results:
        - name: revision
          type: string
        spec: null
        steps:
        - computeResources: {}
          image: alpine:3.20
          name: run
          script: |
            set -eu
            printf "%s" "$(context.taskRun.name)" > "$(results.revision.path)"
    - name: build
      params:
      - name: revision
        value: $(tasks.prepare.results.revision)
      runAfter:
      - prepare
      taskSpec:
        metadata: {}
        params:
        - name: revision
          type: string
        results:
        - name: image
          type: string
        spec: null
        steps:
        - computeResources: {}
          image: alpine:3.20
          name: run
          script: |
            set -eu
            printf "image:%s" "$(params.revision)" > "$(results.image.path)"
  taskRunTemplate:
    serviceAccountName: default
  timeouts:
    pipeline: 1h0m0s
