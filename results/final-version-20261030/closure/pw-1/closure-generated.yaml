apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    retry.tekton.dev/inherited-taskruns: observe=pw-1-source-observe
    retry.tekton.dev/policy: pw-1-closure-policy
    retry.tekton.dev/policy-generation: "1"
    retry.tekton.dev/policy-spec: '{"pipelineRef":"pw-1","resumeWithin":"","retryOnlyLatest":false,"tasks":{"mutate":{"blocksResume":false,"retryWith":["prepare"]}}}'
    retry.tekton.dev/policy-spec-sha256: sha256:3f7184862dff462ab499ceb783c78723a5bcece6faf827348fc9d0cf12071a0e
    retry.tekton.dev/source-pipeline: pw-1
    retry.tekton.dev/source-pipeline-run: pw-1-source
    retry.tekton.dev/source-pipeline-run-uid: 1d6955a3-706a-480d-b396-79348e341bf5
  generateName: pw-1-retry-
  namespace: retry-value-closure-20261030
spec:
  pipelineSpec:
    tasks:
    - name: prepare
      taskSpec:
        metadata: {}
        spec: null
        steps:
        - computeResources: {}
          image: alpine:3.20
          name: run
          script: |
            set -eu
            printf "clean:d22cfc4932cd5f32" > $(workspaces.data.path)/source.txt
            rm -f $(workspaces.data.path)/artifact.txt $(workspaces.data.path)/artifact-input.sha $(workspaces.data.path)/receipt.txt
        workspaces:
        - name: data
      workspaces:
      - name: data
        workspace: shared
    - name: mutate
      runAfter:
      - prepare
      taskSpec:
        metadata: {}
        spec: null
        steps:
        - computeResources: {}
          image: alpine:3.20
          name: run
          script: |
            set -eu
            case "$(context.taskRun.name)" in *-source-*) printf "dirty:d22cfc4932cd5f32" > $(workspaces.data.path)/source.txt; echo INJECTED-PARTIAL-WRITE; exit 1;; esac
            if [ "`cat $(workspaces.data.path)/source.txt`" != "clean:d22cfc4932cd5f32" ]; then echo DIRTY-INPUT; exit 1; fi
            sha256sum $(workspaces.data.path)/source.txt | cut -d" " -f1 | tr -d "\n" > $(workspaces.data.path)/artifact-input.sha
            printf "built:" > $(workspaces.data.path)/artifact.txt; cat $(workspaces.data.path)/artifact-input.sha >> $(workspaces.data.path)/artifact.txt
        workspaces:
        - name: data
      workspaces:
      - name: data
        workspace: shared
    - name: verify
      runAfter:
      - mutate
      taskSpec:
        metadata: {}
        spec: null
        steps:
        - computeResources: {}
          image: alpine:3.20
          name: run
          script: |
            set -eu
            echo VERIFIED-STAGE
        workspaces:
        - name: data
      workspaces:
      - name: data
        workspace: shared
    - name: publish
      runAfter:
      - verify
      taskSpec:
        metadata: {}
        spec: null
        steps:
        - computeResources: {}
          image: alpine:3.20
          name: run
          script: |
            set -eu
            actual=`sha256sum $(workspaces.data.path)/source.txt | cut -d" " -f1`
            recorded=`cat $(workspaces.data.path)/artifact-input.sha`
            if [ "$actual" != "$recorded" ]; then echo STALE-ARTIFACT; exit 1; fi
            if [ "`cat $(workspaces.data.path)/artifact.txt`" != "built:$actual" ]; then echo BAD-ARTIFACT; exit 1; fi
            artifact=`sha256sum $(workspaces.data.path)/artifact.txt | cut -d" " -f1`
            printf "%s %s" "$actual" "$artifact" > $(workspaces.data.path)/receipt.txt
            echo ORACLE-CONSISTENT
        workspaces:
        - name: data
      workspaces:
      - name: data
        workspace: shared
    workspaces:
    - name: shared
  taskRunTemplate:
    serviceAccountName: default
  timeouts:
    pipeline: 1h0m0s
  workspaces:
  - name: shared
    persistentVolumeClaim:
      claimName: pw-1-source
