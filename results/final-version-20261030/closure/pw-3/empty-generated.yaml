apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    retry.tekton.dev/inherited-taskruns: observe=pw-3-source-observe,prepare=pw-3-source-prepare
    retry.tekton.dev/policy: pw-3-empty-policy
    retry.tekton.dev/policy-generation: "1"
    retry.tekton.dev/policy-spec: '{"pipelineRef":"pw-3","resumeWithin":"","retryOnlyLatest":false,"tasks":{}}'
    retry.tekton.dev/policy-spec-sha256: sha256:3ddbb6f1664cdb93267aa81b58db2d1887c837611997173d1d5e56b33f2aabe3
    retry.tekton.dev/shared-state-warning-codes: shared-workspace-across-closure
    retry.tekton.dev/shared-state-warnings-accepted: "true"
    retry.tekton.dev/source-pipeline: pw-3
    retry.tekton.dev/source-pipeline-run: pw-3-source
    retry.tekton.dev/source-pipeline-run-uid: 1a8e5c89-5e70-4067-bb06-e6542873bccf
  generateName: pw-3-retry-
  namespace: retry-value-closure-20261030
spec:
  pipelineSpec:
    tasks:
    - name: mutate
      taskSpec:
        metadata: {}
        spec: null
        steps:
        - computeResources: {}
          image: alpine:3.20
          name: run
          script: |
            set -eu
            case "$(context.taskRun.name)" in *-source-*) printf "dirty:d68b8c04bd565bfd" > $(workspaces.data.path)/source.txt; echo INJECTED-PARTIAL-WRITE; exit 1;; esac
            if [ "`cat $(workspaces.data.path)/source.txt`" != "clean:d68b8c04bd565bfd" ]; then echo DIRTY-INPUT; exit 1; fi
            sha256sum $(workspaces.data.path)/source.txt | cut -d" " -f1 | tr -d "\n" > $(workspaces.data.path)/artifact-input.sha
            printf "built:" > $(workspaces.data.path)/artifact.txt; cat $(workspaces.data.path)/artifact-input.sha >> $(workspaces.data.path)/artifact.txt
        workspaces:
        - name: data
      workspaces:
      - name: data
        workspace: shared
    - name: verify
      runAfter:
      - mutate
      taskSpec:
        metadata: {}
        spec: null
        steps:
        - computeResources: {}
          image: alpine:3.20
          name: run
          script: |
            set -eu
            echo VERIFIED-STAGE
        workspaces:
        - name: data
      workspaces:
      - name: data
        workspace: shared
    - name: publish
      runAfter:
      - verify
      taskSpec:
        metadata: {}
        spec: null
        steps:
        - computeResources: {}
          image: alpine:3.20
          name: run
          script: |
            set -eu
            actual=`sha256sum $(workspaces.data.path)/source.txt | cut -d" " -f1`
            recorded=`cat $(workspaces.data.path)/artifact-input.sha`
            if [ "$actual" != "$recorded" ]; then echo STALE-ARTIFACT; exit 1; fi
            if [ "`cat $(workspaces.data.path)/artifact.txt`" != "built:$actual" ]; then echo BAD-ARTIFACT; exit 1; fi
            artifact=`sha256sum $(workspaces.data.path)/artifact.txt | cut -d" " -f1`
            printf "%s %s" "$actual" "$artifact" > $(workspaces.data.path)/receipt.txt
            echo ORACLE-CONSISTENT
        workspaces:
        - name: data
      workspaces:
      - name: data
        workspace: shared
    workspaces:
    - name: shared
  taskRunTemplate:
    serviceAccountName: default
  timeouts:
    pipeline: 1h0m0s
  workspaces:
  - name: shared
    persistentVolumeClaim:
      claimName: pw-3-source
