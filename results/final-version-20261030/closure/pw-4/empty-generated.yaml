apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    retry.tekton.dev/inherited-taskruns: observe=pw-4-source-observe,prepare=pw-4-source-prepare
    retry.tekton.dev/policy: pw-4-empty-policy
    retry.tekton.dev/policy-generation: "1"
    retry.tekton.dev/policy-spec: '{"pipelineRef":"pw-4","resumeWithin":"","retryOnlyLatest":false,"tasks":{}}'
    retry.tekton.dev/policy-spec-sha256: sha256:557d13f78db1536f2e38c37c4ff30cb1c6e417dc88a19ddcaa14b6e71a38b852
    retry.tekton.dev/shared-state-warning-codes: shared-workspace-across-closure
    retry.tekton.dev/shared-state-warnings-accepted: "true"
    retry.tekton.dev/source-pipeline: pw-4
    retry.tekton.dev/source-pipeline-run: pw-4-source
    retry.tekton.dev/source-pipeline-run-uid: 83a39108-7c6a-45e4-a120-9b3d938dae24
  generateName: pw-4-retry-
  namespace: retry-value-closure-20261030
spec:
  pipelineSpec:
    tasks:
    - name: mutate
      taskSpec:
        metadata: {}
        spec: null
        steps:
        - computeResources: {}
          image: alpine:3.20
          name: run
          script: |
            set -eu
            case "$(context.taskRun.name)" in *-source-*) printf "dirty:c22f3decc2db7875" > $(workspaces.data.path)/source.txt; echo INJECTED-PARTIAL-WRITE; exit 1;; esac
            if [ "`cat $(workspaces.data.path)/source.txt`" != "clean:c22f3decc2db7875" ]; then echo DIRTY-INPUT; exit 1; fi
            sha256sum $(workspaces.data.path)/source.txt | cut -d" " -f1 | tr -d "\n" > $(workspaces.data.path)/artifact-input.sha
            printf "built:" > $(workspaces.data.path)/artifact.txt; cat $(workspaces.data.path)/artifact-input.sha >> $(workspaces.data.path)/artifact.txt
        workspaces:
        - name: data
      workspaces:
      - name: data
        workspace: shared
    - name: verify
      runAfter:
      - mutate
      taskSpec:
        metadata: {}
        spec: null
        steps:
        - computeResources: {}
          image: alpine:3.20
          name: run
          script: |
            set -eu
            echo VERIFIED-STAGE
        workspaces:
        - name: data
      workspaces:
      - name: data
        workspace: shared
    - name: publish
      runAfter:
      - verify
      taskSpec:
        metadata: {}
        spec: null
        steps:
        - computeResources: {}
          image: alpine:3.20
          name: run
          script: |
            set -eu
            actual=`sha256sum $(workspaces.data.path)/source.txt | cut -d" " -f1`
            recorded=`cat $(workspaces.data.path)/artifact-input.sha`
            if [ "$actual" != "$recorded" ]; then echo STALE-ARTIFACT; exit 1; fi
            if [ "`cat $(workspaces.data.path)/artifact.txt`" != "built:$actual" ]; then echo BAD-ARTIFACT; exit 1; fi
            artifact=`sha256sum $(workspaces.data.path)/artifact.txt | cut -d" " -f1`
            printf "%s %s" "$actual" "$artifact" > $(workspaces.data.path)/receipt.txt
            echo ORACLE-CONSISTENT
        workspaces:
        - name: data
      workspaces:
      - name: data
        workspace: shared
    workspaces:
    - name: shared
  taskRunTemplate:
    serviceAccountName: default
  timeouts:
    pipeline: 1h0m0s
  workspaces:
  - name: shared
    persistentVolumeClaim:
      claimName: pw-4-source
