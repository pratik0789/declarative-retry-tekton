apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    retry.tekton.dev/inherited-taskruns: clone=retry-stateful-vct-source-clone
    retry.tekton.dev/policy: retry-stateful-policy
    retry.tekton.dev/policy-generation: "1"
    retry.tekton.dev/policy-spec: '{"pipelineRef":"retry-stateful","resumeWithin":"","retryOnlyLatest":false,"tasks":{"scan":{"blocksResume":false,"retryWith":["build"]}}}'
    retry.tekton.dev/policy-spec-sha256: sha256:3f36c00867e91d9b6fc3ede9c043132a8fd4408e9c718b29ff2afd03cf3584b6
    retry.tekton.dev/shared-state-warning-codes: ephemeral-workspace-across-closure,shared-workspace-across-closure
    retry.tekton.dev/shared-state-warnings-accepted: "true"
    retry.tekton.dev/source-pipeline: retry-stateful
    retry.tekton.dev/source-pipeline-run: retry-stateful-vct-source
    retry.tekton.dev/source-pipeline-run-uid: a7408f0f-bd9c-4a17-8c94-4050cb77567a
  generateName: retry-stateful-retry-
  namespace: retry-value-stateful-20261030-3
spec:
  pipelineSpec:
    tasks:
    - name: build
      params:
      - name: commit
        value: d640c90a82d0
      - name: digest
        value: 6f60a7ffd65e64b74f3dfd2dcf3903f66a03fe2f378b732823926701b61a7c31
      taskSpec:
        metadata: {}
        params:
        - name: commit
          type: string
        - name: digest
          type: string
        results:
        - name: image
          type: string
        spec: null
        steps:
        - computeResources: {}
          image: alpine:3.20
          name: run
          script: |
            set -eu
            source_file="$(workspaces.src.path)/source.txt"
            if [ ! -f "$source_file" ]; then
              echo "STATE-MISSING: source.txt written by clone is not present"
              exit 1
            fi
            actual=`sha256sum "$source_file" | cut -d' ' -f1`
            if [ "$actual" != "$(params.digest)" ]; then
              echo "STATE-MISMATCH: expected $(params.digest), found $actual"
              exit 1
            fi
            echo "STATE-VERIFIED: commit $(params.commit) digest $actual"
            printf 'img-%s' "$(params.commit)" > "$(results.image.path)"
        workspaces:
        - name: src
      workspaces:
      - name: src
        workspace: shared
    - name: scan
      params:
      - name: image
        value: $(tasks.build.results.image)
      runAfter:
      - build
      taskSpec:
        metadata: {}
        params:
        - name: image
          type: string
        spec: null
        steps:
        - computeResources: {}
          image: alpine:3.20
          name: run
          script: |
            case "$(context.taskRun.name)" in
              *-source-*) echo "injected scan failure"; exit 1 ;;
            esac
            echo "scanned $(params.image)"
    - name: deploy
      params:
      - name: image
        value: $(tasks.build.results.image)
      runAfter:
      - scan
      taskSpec:
        metadata: {}
        params:
        - name: image
          type: string
        spec: null
        steps:
        - computeResources: {}
          image: alpine:3.20
          name: run
          script: |
            echo "deployed $(params.image)"
    workspaces:
    - name: shared
  taskRunTemplate:
    serviceAccountName: default
  timeouts:
    pipeline: 1h0m0s
  workspaces:
  - name: shared
    volumeClaimTemplate:
      metadata:
        creationTimestamp: null
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 64Mi
      status: {}
