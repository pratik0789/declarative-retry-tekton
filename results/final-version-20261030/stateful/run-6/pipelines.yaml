    creationTimestamp: "2026-10-30T15:17:17Z"
    generation: 2
    name: retry-stateful
    namespace: retry-value-stateful-20261030-6
    resourceVersion: "6294534"
    uid: 7a48f5f9-c23f-4235-8062-c2ea2f95e471
  spec:
    tasks:
    - name: clone
      taskSpec:
        metadata: {}
        results:
        - name: commit
          type: string
        - name: digest
          type: string
        spec: null
        steps:
        - computeResources: {}
          image: alpine:3.20
          name: run
          script: |
            set -eu
            head -c 64 /dev/urandom | od -An -tx1 | tr -d ' \n' > "$(workspaces.src.path)/source.txt"
            head -c 6 /dev/urandom | od -An -tx1 | tr -d ' \n' > "$(results.commit.path)"
            sha256sum "$(workspaces.src.path)/source.txt" | cut -d' ' -f1 | tr -d '\n' > "$(results.digest.path)"
        workspaces:
        - name: src
      workspaces:
      - name: src
        workspace: shared
    - name: build
      params:
      - name: commit
        value: $(tasks.clone.results.commit)
      - name: digest
        value: $(tasks.clone.results.digest)
      runAfter:
      - clone
      taskSpec:
        metadata: {}
        params:
        - name: commit
          type: string
        - name: digest
          type: string
        results:
        - name: image
          type: string
        spec: null
        steps:
        - computeResources: {}
          image: alpine:3.20
          name: run
          script: |
            set -eu
            source_file="$(workspaces.src.path)/source.txt"
            if [ ! -f "$source_file" ]; then
              echo "STATE-MISSING: source.txt written by clone is not present"
              exit 1
            fi
            actual=`sha256sum "$source_file" | cut -d' ' -f1`
            if [ "$actual" != "$(params.digest)" ]; then
              echo "STATE-MISMATCH: expected $(params.digest), found $actual"
              exit 1
            fi
            echo "STATE-VERIFIED: commit $(params.commit) digest $actual"
            printf 'img-%s' "$(params.commit)" > "$(results.image.path)"
        workspaces:
        - name: src
      workspaces:
      - name: src
        workspace: shared
    - name: scan
      params:
      - name: image
        value: $(tasks.build.results.image)
      runAfter:
      - build
      taskSpec:
        metadata: {}
        params:
        - name: image
          type: string
        spec: null
        steps:
        - computeResources: {}
          image: alpine:3.20
          name: run
          script: |
            case "$(context.taskRun.name)" in
              *-source-*) echo "injected scan failure"; exit 1 ;;
            esac
            echo "scanned $(params.image)"
    - name: deploy
      params:
      - name: image
        value: $(tasks.build.results.image)
      runAfter:
      - scan
      taskSpec:
        metadata: {}
        params:
        - name: image
          type: string
        spec: null
        steps:
        - computeResources: {}
          image: alpine:3.20
          name: run
          script: |
            echo "deployed v2 $(params.image)"
    workspaces:
    - name: shared
