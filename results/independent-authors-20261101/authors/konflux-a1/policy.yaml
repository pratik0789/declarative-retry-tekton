apiVersion: retry.tekton.dev/v1alpha1
kind: PipelineRetryPolicy
metadata:
  generation: 1
  name: template-build-retry
spec:
  pipelineRef: template-build
  tasks:
    build-container:
      retryWith:
      - prefetch-dependencies
      - clone-repository
    build-source-image:
      retryWith:
      - prefetch-dependencies
      - clone-repository
    prefetch-dependencies:
      retryWith:
      - clone-repository
    push-dockerfile:
      retryWith:
      - clone-repository
    sast-shell-check:
      retryWith:
      - clone-repository
    sast-snyk-check:
      retryWith:
      - clone-repository
    sast-unicode-check:
      retryWith:
      - clone-repository
