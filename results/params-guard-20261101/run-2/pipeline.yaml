  creationTimestamp: "2026-11-01T16:43:39Z"
  generation: 1
  name: retry-params
  namespace: retry-params-20261101-r2
  resourceVersion: "6829420"
  uid: 46432e73-350b-4d48-b686-e359c0bd782f
spec:
  params:
  - name: release
    type: string
  - default: stable
    name: channel
    type: string
  tasks:
  - name: clone
    taskSpec:
      metadata: {}
      results:
      - name: commit
        type: string
      - name: digest
        type: string
      spec: null
      steps:
      - computeResources: {}
        image: alpine:3.20
        name: run
        script: |
          set -eu
          printf 'release=%s\n' "$(params.release)" > "$(workspaces.src.path)/source.txt"
          head -c 64 /dev/urandom | od -An -tx1 | tr -d ' \n' >> "$(workspaces.src.path)/source.txt"
          head -c 6 /dev/urandom | od -An -tx1 | tr -d ' \n' > "$(results.commit.path)"
          sha256sum "$(workspaces.src.path)/source.txt" | cut -d' ' -f1 | tr -d '\n' > "$(results.digest.path)"
      workspaces:
      - name: src
    workspaces:
    - name: src
      workspace: shared
  - name: build
    params:
    - name: commit
      value: $(tasks.clone.results.commit)
    - name: digest
      value: $(tasks.clone.results.digest)
    - name: tag
      value: $(params.release)-$(params.channel)
    runAfter:
    - clone
    taskSpec:
      metadata: {}
      params:
      - name: commit
        type: string
      - name: digest
        type: string
      - name: tag
        type: string
      results:
      - name: image
        type: string
      spec: null
      steps:
      - computeResources: {}
        image: alpine:3.20
        name: run
        script: |
          set -eu
          f="$(workspaces.src.path)/source.txt"
          [ -f "$f" ] || { echo "STATE-MISSING"; exit 1; }
          actual=`sha256sum "$f" | cut -d' ' -f1`
          [ "$actual" = "$(params.digest)" ] || { echo "STATE-MISMATCH"; exit 1; }
          head -n1 "$f" | grep -qx "release=$(params.release)" || { echo "RELEASE-MISMATCH"; exit 1; }
          echo "STATE-VERIFIED commit $(params.commit) tag $(params.tag)"
          printf 'img-%s-%s' "$(params.commit)" "$(params.tag)" > "$(results.image.path)"
      workspaces:
      - name: src
    workspaces:
    - name: src
      workspace: shared
  - name: scan
    params:
    - name: image
      value: $(tasks.build.results.image)
    - name: run
      value: $(context.pipelineRun.name)
    runAfter:
    - build
    taskSpec:
      metadata: {}
      params:
      - name: image
        type: string
      - name: run
        type: string
      spec: null
      steps:
      - computeResources: {}
        image: alpine:3.20
        name: run
        script: |
          case "$(params.run)" in
            *-source) echo "injected scan failure"; exit 1 ;;
          esac
          echo "scanned $(params.image)"
  - name: deploy
    params:
    - name: image
      value: $(tasks.build.results.image)
    - name: bound
      value: $(workspaces.shared.bound)
    runAfter:
    - scan
    taskSpec:
      metadata: {}
      params:
      - name: image
        type: string
      - name: bound
        type: string
      spec: null
      steps:
      - computeResources: {}
        image: alpine:3.20
        name: run
        script: |
          echo "DEPLOYED $(params.image) channel=$(params.channel) bound=$(params.bound)"
  workspaces:
  - name: shared
