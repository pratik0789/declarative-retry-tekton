apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    retry.tekton.dev/inherited-taskruns: observe=pw-4-source-observe
    retry.tekton.dev/policy: pw-4-closure-policy
    retry.tekton.dev/policy-generation: "1"
    retry.tekton.dev/source-pipeline: pw-4
    retry.tekton.dev/source-pipeline-run: pw-4-source
    retry.tekton.dev/source-pipeline-run-uid: a6c03333-ec50-4191-b5f9-ad0b6055f88b
  generateName: pw-4-retry-
  namespace: retry-direction-20261025-r1
spec:
  pipelineSpec:
    tasks:
    - name: prepare
      taskSpec:
        metadata: {}
        spec: null
        steps:
        - computeResources: {}
          image: alpine:3.20
          name: run
          script: |
            set -eu
            printf "clean:c22f3decc2db7875" > $(workspaces.data.path)/source.txt
            rm -f $(workspaces.data.path)/artifact.txt $(workspaces.data.path)/artifact-input.sha $(workspaces.data.path)/receipt.txt
        workspaces:
        - name: data
      workspaces:
      - name: data
        workspace: shared
    - name: mutate
      runAfter:
      - prepare
      taskSpec:
        metadata: {}
        spec: null
        steps:
        - computeResources: {}
          image: alpine:3.20
          name: run
          script: |
            set -eu
            case "$(context.pipelineRun.name)" in *-source) printf "dirty:c22f3decc2db7875" > $(workspaces.data.path)/source.txt; echo INJECTED-PARTIAL-WRITE; exit 1;; esac
            if [ "`cat $(workspaces.data.path)/source.txt`" != "clean:c22f3decc2db7875" ]; then echo DIRTY-INPUT; exit 1; fi
            sha256sum $(workspaces.data.path)/source.txt | cut -d" " -f1 | tr -d "\n" > $(workspaces.data.path)/artifact-input.sha
            printf "built:" > $(workspaces.data.path)/artifact.txt; cat $(workspaces.data.path)/artifact-input.sha >> $(workspaces.data.path)/artifact.txt
        workspaces:
        - name: data
      workspaces:
      - name: data
        workspace: shared
    - name: verify
      runAfter:
      - mutate
      taskSpec:
        metadata: {}
        spec: null
        steps:
        - computeResources: {}
          image: alpine:3.20
          name: run
          script: |
            set -eu
            echo VERIFIED-STAGE
        workspaces:
        - name: data
      workspaces:
      - name: data
        workspace: shared
    - name: publish
      runAfter:
      - verify
      taskSpec:
        metadata: {}
        spec: null
        steps:
        - computeResources: {}
          image: alpine:3.20
          name: run
          script: |
            set -eu
            actual=`sha256sum $(workspaces.data.path)/source.txt | cut -d" " -f1`
            recorded=`cat $(workspaces.data.path)/artifact-input.sha`
            if [ "$actual" != "$recorded" ]; then echo STALE-ARTIFACT; exit 1; fi
            if [ "`cat $(workspaces.data.path)/artifact.txt`" != "built:$actual" ]; then echo BAD-ARTIFACT; exit 1; fi
            artifact=`sha256sum $(workspaces.data.path)/artifact.txt | cut -d" " -f1`
            printf "%s %s" "$actual" "$artifact" > $(workspaces.data.path)/receipt.txt
            echo ORACLE-CONSISTENT
        workspaces:
        - name: data
      workspaces:
      - name: data
        workspace: shared
    workspaces:
    - name: shared
  taskRunTemplate:
    serviceAccountName: default
  timeouts:
    pipeline: 1h0m0s
  workspaces:
  - name: shared
    persistentVolumeClaim:
      claimName: pw-4-source
