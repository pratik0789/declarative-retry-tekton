apiVersion: v1
kind: List
items:
  - apiVersion: tekton.dev/v1
    kind: TaskRun
    metadata:
      name: delivery-1-clone
      labels:
        tekton.dev/pipelineRun: delivery-1
        tekton.dev/pipelineTask: clone
    status:
      conditions:
        - {type: Succeeded, status: "True", reason: Succeeded}
  - apiVersion: tekton.dev/v1
    kind: TaskRun
    metadata:
      name: delivery-1-build
      labels:
        tekton.dev/pipelineRun: delivery-1
        tekton.dev/pipelineTask: build
    status:
      conditions:
        - {type: Succeeded, status: "True", reason: Succeeded}
      results:
        - {name: image, value: example.invalid/app@sha256:abc}
  - apiVersion: tekton.dev/v1
    kind: TaskRun
    metadata:
      name: delivery-1-scan
      labels:
        tekton.dev/pipelineRun: delivery-1
        tekton.dev/pipelineTask: scan
    status:
      conditions:
        - {type: Succeeded, status: "False", reason: Failed}
